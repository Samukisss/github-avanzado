name: CI Develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Actualizar README
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md

      - name: Guardar cambio en README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar README desde CI [skip ci]" || echo "Sin cambios"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Comparar DEV_TOKEN
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV_TOKEN correcto"
          } else {
            Write-Host "DEV_TOKEN no coincide"
            exit 1
          }